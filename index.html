<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Preview</title>
    <script id="boot">
      (function () {
        var brands = __BRANDS__;
        var pick = function (name) {
          return name && (brands['sample-' + name] ? 'sample-' + name : brands[name] ? name : null);
        };
        var slug = pick(location.hostname.split('.')[0]) || pick(new URLSearchParams(location.search).get('b'));
        var b = brands[slug];
        if (!b) return;
        document.title = b.title;
        if (b.hero) {
          var img = document.createElement('link');
          img.rel = 'preload';
          img.as = 'image';
          img.setAttribute('fetchpriority', 'high');
          img.setAttribute('imagesrcset', b.hero);
          img.setAttribute('imagesizes', b.sizes);
          document.head.appendChild(img);
        }
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = b.fonts;
        document.head.appendChild(css);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

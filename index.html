<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Preview</title>
    <script>
      (function () {
        var brands = __BRANDS__;
        var samples = { plumbing: 'sample-plumbing', barber: 'sample-barber', realestate: 'sample-realestate' };
        var label = location.hostname.split('.')[0];
        var asked = new URLSearchParams(location.search).get('b');
        var slug = samples[label] || label;
        if (!brands[slug]) slug = samples[asked] || asked;
        var b = brands[slug];
        if (!b) return;
        document.title = b.title;
        var img = document.createElement('link');
        img.rel = 'preload';
        img.as = 'image';
        img.setAttribute('fetchpriority', 'high');
        img.setAttribute('imagesrcset', b.hero);
        img.setAttribute('imagesizes', b.sizes);
        document.head.appendChild(img);
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = b.fonts;
        document.head.appendChild(css);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
